name: Announce Release to Discord (Components V2)

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            title:
                description: 'Release Title'
                required: false
                default: 'Test Release'
            tag:
                description: 'Release Tag'
                required: false
                default: 'v1.0.0'
            body:
                description: 'Release Body'
                required: false
                default: 'This is a test announcement.'

jobs:
    notify-discord:
        runs-on: ubuntu-latest
        steps:
            - name: Send Discord V2 Component Webhook
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
                  DISCORD_ROLE_ID: '1568086848314671214'
                  RELEASE_TITLE: ${{ inputs.title || github.event.release.name || github.event.release.tag_name }}
                  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
                  RELEASE_URL: ${{ github.event.release.html_url || format('https://github.com/{0}/releases', github.repository) }}
                  RELEASE_BODY: ${{ inputs.body || github.event.release.body }}
                  REPO_NAME: ${{ github.repository }}
              run: |
                  if [ -z "$DISCORD_WEBHOOK" ]; then
                    echo "::error::DISCORD_WEBHOOK secret is not set! Go to Settings -> Secrets and variables -> Actions to add it."
                    exit 1
                  fi

                  PAYLOAD=$(jq -n \
                    --arg title "$RELEASE_TITLE" \
                    --arg tag "$RELEASE_TAG" \
                    --arg url "$RELEASE_URL" \
                    --arg desc "${RELEASE_BODY:0:1000}" \
                    --arg repo "$REPO_NAME" \
                    --arg role "$DISCORD_ROLE_ID" \
                    '{
                      flags: 32768,
                      allowed_mentions: {
                        parse: [],
                        roles: [$role]
                      },
                      components: [
                        {
                          type: 17,
                          components: [
                            {
                              type: 10,
                              content: "# New Release: \($title)\n**Repository:** `\($repo)` • **Tag:** `\($tag)`\n\n" + (if $desc != "" then $desc else "*No release notes provided.*" end)
                            },
                            {
                              type: 14,
                              divider: true,
                              spacing: 1
                            },
                            {
                              type: 1,
                              components: [
                                {
                                  type: 2,
                                  style: 5,
                                  label: "View Release Notes",
                                  url: $url
                                },
                                {
                                  type: 2,
                                  style: 5,
                                  label: "Source Code (ZIP)",
                                  url: "https://github.com/\($repo)/archive/refs/tags/\($tag).zip"
                                }
                              ]
                            }
                          ]
                        },
                        {
                          type: 10,
                          content: "-# ||<@&\($role)>||"
                        }
                      ]
                    }')

                  TARGET_URL="$DISCORD_WEBHOOK"
                  if [[ "$TARGET_URL" != *"with_components=true"* ]]; then
                    if [[ "$TARGET_URL" == *"?"* ]]; then
                      TARGET_URL="${TARGET_URL}&with_components=true"
                    else
                      TARGET_URL="${TARGET_URL}?with_components=true"
                    fi
                  fi

                  HTTP_CODE=$(curl -s -o /tmp/discord_response.txt -w "%{http_code}" \
                       -H "Content-Type: application/json" \
                       -X POST \
                       -d "$PAYLOAD" \
                       "$TARGET_URL")

                  echo "Discord response code: $HTTP_CODE"
                  if [ "$HTTP_CODE" -ge 400 ]; then
                    echo "Discord returned an error:"
                    cat /tmp/discord_response.txt
                    exit 1
                  fi
