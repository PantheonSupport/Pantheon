name: Announce Release to Discord (Components V2)

on:
    release:
        types: [published]

jobs:
    notify-discord:
        runs-on: ubuntu-latest
        steps:
            - name: Send Discord V2 Component Webhook
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
                  RELEASE_TITLE: ${{ github.event.release.name || github.event.release.tag_name }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
                  RELEASE_URL: ${{ github.event.release.html_url }}
                  RELEASE_BODY: ${{ github.event.release.body }}
                  REPO_NAME: ${{ github.repository }}
              run: |
                  PAYLOAD=$(jq -n \
                    --arg title "$RELEASE_TITLE" \
                    --arg tag "$RELEASE_TAG" \
                    --arg url "$RELEASE_URL" \
                    --arg desc "${RELEASE_BODY:0:1000}" \
                    --arg repo "$REPO_NAME" \
                    '{
                      flags: 32768,
                      components: [
                        {
                          type: 17,
                          accent_color: 5793266,
                          components: [
                            {
                              type: 10,
                              content: "# 🚀 New Release: \($title)\n**Repository:** `\($repo)` • **Tag:** `\($tag)`\n\n" + (if $desc != "" then $desc else "*No release notes provided.*" end)
                            },
                            {
                              type: 14
                            },
                            {
                              type: 1,
                              components: [
                                {
                                  type: 2,
                                  style: 5,
                                  label: "View Release Notes",
                                  url: $url
                                },
                                {
                                  type: 2,
                                  style: 5,
                                  label: "Source Code (ZIP)",
                                  url: "https://github.com/\($repo)/archive/refs/tags/\($tag).zip"
                                }
                              ]
                            }
                          ]
                        }
                      ]
                    }')

                  HTTP_CODE=$(curl -s -o /tmp/discord_response.txt -w "%{http_code}" \
                       -H "Content-Type: application/json" \
                       -X POST \
                       -d "$PAYLOAD" \
                       "$DISCORD_WEBHOOK")

                  echo "Discord response code: $HTTP_CODE"
                  if [ "$HTTP_CODE" -ge 400 ]; then
                    echo "Discord returned an error:"
                    cat /tmp/discord_response.txt
                    exit 1
                  fi
